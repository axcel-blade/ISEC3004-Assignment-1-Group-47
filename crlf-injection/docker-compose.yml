services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_SERVER: db
    volumes:
      - ./vulnerable-app:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: bankDB
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
